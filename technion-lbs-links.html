<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טכניון · שירותים מבוססי מיקום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --ink: #111827;
    --muted: #8b93a1;
    --line: #ececf1;
    --accent: #e11d48;
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px -12px rgba(17,24,39,.12);
  }

  body {
    font-family: "Heebo", -apple-system, "Arial Hebrew", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 8vh 6vw;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 420px; }

  header { margin-bottom: 2.75rem; }
  h1 {
    font-size: clamp(1.75rem, 7vw, 2.25rem);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.15;
  }
  .sub {
    margin-top: .5rem;
    font-size: .875rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .links { display: flex; flex-direction: column; gap: .625rem; }

  a.link {
    display: flex; align-items: center; gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.125rem 1.25rem;
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: border-color .15s ease, transform .12s ease;
  }
  a.link:hover { border-color: #d6d6de; }
  a.link:active { transform: scale(.99); }

  a.link .label { flex: 1; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  a.link .note  { font-size: .8rem; font-weight: 500; color: var(--muted); }
  a.link .arrow { color: var(--muted); flex-shrink: 0; transition: transform .15s ease; }
  a.link:hover .arrow { transform: translateX(-3px); }

  a.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  a.primary .label { color: #fff; }
  a.primary .note  { color: #a8adb8; }
  a.primary .arrow { color: #a8adb8; }
  a.primary:hover { border-color: var(--ink); }

  footer {
    margin-top: 2.75rem; padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-size: .8125rem; font-weight: 500; color: var(--muted);
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  footer .day { font-weight: 700; color: var(--ink); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --surface: #14171e;
      --ink: #f3f4f6;
      --muted: #767d8c;
      --line: #22262f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
    a.link:hover { border-color: #2e3440; }
    a.primary { background: #f3f4f6; border-color: #f3f4f6; }
    a.primary .label { color: #0b0d12; }
    a.primary .note, a.primary .arrow { color: #6b7280; }
    a.primary:hover { border-color: #f3f4f6; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>שירותים<br>מבוססי מיקום</h1>
    <div class="sub">טכניון · 016833</div>
  </header>

  <nav class="links">

    <a class="link primary" href="https://docs.google.com/forms/d/e/1FAIpQLSelhf66F6cHKo4N5HnH5tIvomgQJTvPGROsRiXGiZe4lQeW9g/viewform" target="_blank" rel="noopener">
      <span class="label">שאלון המשוב</span>
      <span class="note">בלי שם · 6 דק'</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="link" href="https://www.linkedin.com/in/zacharadn" target="_blank" rel="noopener">
      <span class="label">זכר עדינייב</span>
      <span class="note">לינקדאין</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="link" href="https://www.linkedin.com/in/elisafra" target="_blank" rel="noopener">
      <span class="label">אלי ספרא</span>
      <span class="note">לינקדאין</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

  </nav>

  <footer>
    <span>יום ההדגמות</span>
    <span class="day">21/07 · 12:30</span>
  </footer>

</div>
</body>
</html>
