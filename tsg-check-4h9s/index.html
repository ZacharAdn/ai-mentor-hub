<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>בדיקת גישה - Bonim Bina</title>
<style>
  /* Client-network diagnostic — intentionally NO Google Fonts (Google may be blocked on the tested network) */
  :root {
    --bg: #f4f6f4; --card: #ffffff; --text: #2b3a3f; --muted: #5a6b72;
    --petrol: #0F4C5C; --amber: #E09F3E; --line: #dcd8d0;
    --ok-bg: #e8f3ec; --ok-fg: #1e6b45; --bad-bg: #fbe9e7; --bad-fg: #b3362a;
    --wait-bg: #f3f0e9; --wait-fg: #7a6a4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14211f; --card: #1d2d2b; --text: #e8ece9; --muted: #9fb0ac;
      --petrol: #7fc3d4; --amber: #E09F3E; --line: #344744;
      --ok-bg: #1d3a2c; --ok-fg: #8fd4ae; --bad-bg: #46231f; --bad-fg: #f0a094;
      --wait-bg: #33302a; --wait-fg: #cfc0a0;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 32px 28px; max-width: 520px; width: 100%;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
  }
  h1 { color: var(--petrol); font-size: 1.35rem; padding-bottom: 10px; border-bottom: 2px solid var(--amber); margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: 10px; margin-bottom: 10px;
    font-size: 1rem; font-weight: 600;
    background: var(--wait-bg); color: var(--wait-fg);
    transition: background .3s, color .3s;
  }
  .row .icon { font-size: 1.25rem; width: 1.6rem; text-align: center; flex-shrink: 0; }
  .row .note { font-weight: 400; font-size: .8rem; opacity: .85; margin-top: 2px; }
  .row.ok  { background: var(--ok-bg);  color: var(--ok-fg); }
  .row.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .footer {
    margin-top: 22px; padding: 12px 14px; border-radius: 10px;
    background: var(--wait-bg); color: var(--text); font-size: .92rem; line-height: 1.55;
  }
  .footer b { color: var(--petrol); }
  .stamp { margin-top: 10px; color: var(--muted); font-size: .78rem; text-align: left; direction: ltr; }
</style>
</head>
<body>
<div class="card">
  <h1>בדיקת גישה קצרה</h1>
  <div class="sub">שלושת הסימנים מתמלאים לבד תוך כמה שניות - לא צריך ללחוץ כלום.</div>

  <div class="row ok" id="chk-page"><span class="icon">✓</span><div>העמוד נטען (github.io זמין)</div></div>
  <div class="row" id="chk-db"><span class="icon">⏳</span><div>בסיס הנתונים (supabase.co)<div class="note" id="note-db"></div></div></div>
  <div class="row" id="chk-goog"><span class="icon">⏳</span><div>מסמכי Google (docs.google.com)<div class="note" id="note-goog"></div></div></div>

  <div class="footer">
    כשהכל מסיים להתמלא: <b>צלמו מסך של העמוד הזה ושלחו לזכר בוואטסאפ.</b><br>
    גם אם יש איקס אדום - זה בדיוק המידע שאנחנו צריכים.
  </div>
  <div class="stamp" id="stamp"></div>
</div>

<script>
(function () {
  document.getElementById('stamp').textContent = new Date().toLocaleString('he-IL');

  function setRow(id, ok, noteId, noteText) {
    var row = document.getElementById(id);
    row.classList.remove('ok', 'bad');
    row.classList.add(ok ? 'ok' : 'bad');
    row.querySelector('.icon').textContent = ok ? '✓' : '✗';
    if (noteId) document.getElementById(noteId).textContent = noteText || '';
  }

  function probe(url, opts, timeoutMs) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, timeoutMs || 6000);
    opts = opts || {};
    opts.signal = ctrl.signal;
    opts.cache = 'no-store';
    return fetch(url, opts).then(
      function (r) { clearTimeout(t); return true; },
      function ()  { clearTimeout(t); return false; }
    );
  }

  // Supabase: real CORS request to the REST gateway. A 401 still proves the network path works.
  probe('https://ncsfobfcfcaxraclxynq.supabase.co/rest/v1/', { mode: 'cors' })
    .then(function (ok) {
      setRow('chk-db', ok, 'note-db', ok ? 'החיבור עובד' : 'לא הצלחנו להגיע - כנראה חסום ברשת');
    });

  // Google: opaque probe (no CORS on docs.google.com) — resolve = reachable, reject/timeout = blocked.
  probe('https://docs.google.com/favicon.ico', { mode: 'no-cors' })
    .then(function (ok) {
      setRow('chk-goog', ok, 'note-goog', ok ? 'נגיש מהרשת הזו' : 'חסום - כמו שחשבנו');
    });
})();
</script>
</body>
</html>
